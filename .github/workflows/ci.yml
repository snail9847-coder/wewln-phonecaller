name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Show platform
        run: python -c "import platform, sys; print(platform.platform(), sys.version)"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: python -m ruff check .

      - name: Format (ruff format --check)
        run: python -m ruff format --check .

      - name: Tests (pytest)
        # bash (Git Bash on Windows) -eo pipefail: a failure fails the step despite tee.
        shell: bash
        run: python -m pytest -q -rfE --tb=short 2>&1 | tee pytest.log

      - name: Failure details as annotations (readable on the run page)
        if: failure()
        shell: bash
        run: python .github/scripts/annotate.py pytest.log

      - name: CLI check-config
        run: python -m wewln_phonecaller check-config

  asterisk-live:
    # A real Asterisk from Ubuntu's packages (24.04: Asterisk 20 LTS, 26.04: Asterisk 22 LTS),
    # driven over ARI. Calls go to Local channels of a test dialplan: no SIP account, no phone
    # network, nothing leaves the runner.
    name: ${{ matrix.os }} / live Asterisk (ARI)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    defaults:
      run:
        # bash -eo pipefail: a failing command fails the step even when piped into tee.
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install and configure Asterisk with the sample files
        run: bash deploy/asterisk/ci/setup.sh 2>&1 | tee setup.log

      - name: Install wewln
        run: |
          python3 --version
          python3 -m venv .venv
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Live ARI tests
        env:
          ASTERISK_LIVE_ARI_URL: http://127.0.0.1:8088
          ASTERISK_LIVE_ARI_USER: wewln
        run: |
          .venv/bin/python -m pytest -q -m asterisk_live -p no:cacheprovider -rA --tb=short \
            2>&1 | tee pytest-live.log

      - name: wewln telephony check against the live Asterisk
        env:
          WEWLN_TELEPHONY_PROVIDER: asterisk
          WEWLN_ARI_PASSWORD: ${{ env.ASTERISK_LIVE_ARI_PASSWORD }}
          WEWLN_ASTERISK_ENDPOINT: "Local/{number}@wewln-ci"
          WEWLN_LOG_TO_FILE: "false"
        run: .venv/bin/python -m wewln_phonecaller telephony check 2>&1 | tee telephony-check.log

      - name: Asterisk log
        if: always()
        run: |
          {
            sudo asterisk -rx "core show channels" || true
            sudo tail -n 120 /var/log/asterisk/ci.log 2>/dev/null || true
            sudo tail -n 60 /var/log/asterisk/messages.log 2>/dev/null \
              || sudo tail -n 60 /var/log/asterisk/messages 2>/dev/null || true
          } 2>&1 | tee asterisk.log

      - name: Results as annotations (readable on the run page)
        if: always()
        run: python3 .github/scripts/annotate.py --notice pytest-live.log telephony-check.log

      - name: Failure details as annotations
        if: failure()
        run: >-
          python3 .github/scripts/annotate.py
          setup.log pytest-live.log telephony-check.log asterisk.log
