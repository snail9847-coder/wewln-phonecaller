[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wewln-phonecaller"
version = "0.4.0"
description = "Russian-language AI voice calling for Windows 10/11, optionally controlled from Notion; simulation-first."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.10,<4",
  # Windows Credential Manager for the Notion token (other systems: WEWLN_NOTION_TOKEN).
  "keyring>=25.2,<26; sys_platform == 'win32'",
  # Phone number validation and E.164 normalization (Google libphonenumber metadata).
  "phonenumbers>=8.13,<10",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.4,<3",
  # Windows has no IANA time zone database; zoneinfo needs this package there.
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
# The voice engine (docs/VOICE.md); each backend is installed only when it is used.
# Speech recognition: Vosk (Apache-2.0; a 45 MB Russian model runs on any CPU).
vosk = ["vosk>=0.3.45", "numpy>=1.26"]
# Speech recognition: faster-whisper (MIT; more accurate, needs more CPU or a GPU).
whisper = ["faster-whisper>=1.1", "numpy>=1.26"]
# Speech synthesis: Piper (piper-tts 1.3+ is GPL-3.0; the voices have their own licenses).
piper = ["piper-tts>=1.2", "numpy>=1.26"]
voice = ["vosk>=0.3.45", "piper-tts>=1.2", "numpy>=1.26"]
dev = [
  "pytest>=8.2",
  "pytest-aiohttp>=1.1",
  "pytest-asyncio>=0.24",
  # Pinned to one minor version: newer ruff releases may change lint and format rules.
  "ruff>=0.17.3,<0.18",
]

[project.scripts]
wewln = "wewln_phonecaller.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
markers = [
  "asterisk_live: needs a running Asterisk with ARI (ASTERISK_LIVE_* variables; CI job asterisk-live)",
  "voice_models: needs the voice extras and the models (WEWLN_TEST_MODELS_DIR; CI job voice-models)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "S310", "S603"]
