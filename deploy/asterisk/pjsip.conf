; wewln sample pjsip.conf. Copy to /etc/asterisk/pjsip.conf and replace every CHANGE_ME.
;
; - "softphone": a free softphone (MicroSIP) on the same Windows PC, for test calls that never
;   touch the phone network: wewln calls test --softphone
; - "wewln-trunk": the SIP trunk of your provider: the ONLY way calls reach real phones.
;   wewln dials PJSIP/<number>@wewln-trunk (WEWLN_ASTERISK_ENDPOINT).
; See docs/ASTERISK.md.

;=============================== transport
[transport-udp]
type = transport
protocol = udp
; In WSL2 (default NAT networking) this port is reachable from this Windows PC only.
; On a server reachable from the internet, never open 5060 to everyone.
bind = 0.0.0.0:5060

;=============================== local softphone
[softphone]
type = endpoint
transport = transport-udp
; This context can reach nothing but the echo test (extensions.conf).
context = wewln-softphone
disallow = all
allow = alaw,ulaw
auth = softphone-auth
aors = softphone
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

[softphone-auth]
type = auth
auth_type = userpass
username = softphone
; A long random password (openssl rand -hex 16); type it into MicroSIP.
password = CHANGE_ME_SOFTPHONE_PASSWORD

[softphone]
type = aor
max_contacts = 1
remove_existing = yes
qualify_frequency = 30

;=============================== SIP trunk (from your provider's settings page)
; Registration: only if the provider asks for it (it is usually needed for incoming calls only).
;[wewln-trunk-reg]
;type = registration
;transport = transport-udp
;outbound_auth = wewln-trunk-auth
;server_uri = sip:CHANGE_ME_SIP_SERVER
;client_uri = sip:CHANGE_ME_SIP_LOGIN@CHANGE_ME_SIP_SERVER
;retry_interval = 60

[wewln-trunk-auth]
type = auth
auth_type = userpass
username = CHANGE_ME_SIP_LOGIN
password = CHANGE_ME_SIP_PASSWORD

[wewln-trunk]
type = aor
contact = sip:CHANGE_ME_SIP_SERVER:5060
qualify_frequency = 60

[wewln-trunk]
type = endpoint
transport = transport-udp
; Calls coming in from the provider are refused (extensions.conf).
context = wewln-inbound
disallow = all
allow = alaw,ulaw
outbound_auth = wewln-trunk-auth
aors = wewln-trunk
from_user = CHANGE_ME_SIP_LOGIN
from_domain = CHANGE_ME_SIP_SERVER
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

[wewln-trunk]
type = identify
endpoint = wewln-trunk
match = CHANGE_ME_SIP_SERVER
