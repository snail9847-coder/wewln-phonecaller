; wewln sample extensions.conf: replaces the stock file (its demo contexts are not needed).
; Copy to /etc/asterisk/extensions.conf.
;
; Nothing in this dialplan can reach the phone network: only wewln places outgoing calls (over
; ARI). So neither a caller from the trunk nor a stolen softphone password can make calls.
[general]
static = yes
writeprotect = yes
clearglobalvars = no

[globals]

; Calls coming in from the SIP trunk: wewln does not take incoming calls.
[wewln-inbound]
exten => _X.,1,NoOp(wewln: incoming calls are not served)
 same => n,Hangup(21)
exten => _+X.,1,Hangup(21)
exten => s,1,Hangup(21)

; The local softphone: 600 is an echo test (you hear yourself), anything else is refused.
[wewln-softphone]
exten => 600,1,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()
exten => _X.,1,Hangup(21)
exten => _+X.,1,Hangup(21)
