; wewln sample http.conf: Asterisk's built-in web server, used only by ARI.
; Copy to /etc/asterisk/http.conf (see docs/ASTERISK.md).
[general]
enabled = yes
; This computer only. In WSL2, Windows reaches it as http://127.0.0.1:8088 (localhost forwarding).
; Never bind it to 0.0.0.0: ARI can place calls.
bindaddr = 127.0.0.1
bindport = 8088
