; wewln sample ari.conf: one ARI user for wewln. Copy to /etc/asterisk/ari.conf.
; Put a long random password instead of CHANGE_ME_ARI_PASSWORD, e.g. from
;   openssl rand -hex 24
; and give the same password to wewln on Windows (it is stored in the Credential Manager):
;   wewln telephony secret set ari-password
; Keep the file readable for Asterisk only: sudo chown root:asterisk ari.conf; sudo chmod 640 ari.conf
[general]
enabled = yes
pretty = no

[wewln]
type = user
read_only = no
password = CHANGE_ME_ARI_PASSWORD
password_format = plain
