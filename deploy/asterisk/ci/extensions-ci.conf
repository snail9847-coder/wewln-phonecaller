; CI only (appended to extensions.conf by the asterisk-live job): test destinations reached over
; Local channels, so the live tests involve no SIP and no phone network. The extension is the
; digits of the number wewln dials (WEWLN_ASTERISK_ENDPOINT=Local/{number}@wewln-ci).
[wewln-ci]
; answers; wewln plays the message and hangs up
exten => 994124980100,1,Answer()
 same => n,Wait(30)
 same => n,Hangup()
; busy
exten => 994124980117,1,Busy(10)
; rings until the ring timeout
exten => 994124980119,1,Ringing()
 same => n,Wait(60)
 same => n,Hangup()
; rejected (cause 21)
exten => 994124980121,1,Hangup(21)
; network congestion
exten => 994124980134,1,Congestion(10)
